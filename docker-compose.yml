services:
  db:
    image: postgres:16-alpine
    container_name: tpv-stripe-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tpv_stripe
    ports:
      - '5432:5432'
    volumes:
      - tpv_pgdata:/var/lib/postgresql/data

volumes:
  tpv_pgdata:
